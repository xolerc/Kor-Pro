name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create & Build Android App
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6
          mkdir -p www
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head>
          <meta http-equiv="refresh" content="0;url=https://xolericuz.github.io/Kor-Pro/">
          <meta name="viewport" content="width=device-width,initial-scale=1.0">
          </head><body>Loading KOD PRO...</body></html>
          EOF
          cat > capacitor.config.json << 'CAPEOF'
          {"appId":"uz.xoleric.kodpro","appName":"KOD PRO","webDir":"www","bundledWebRuntime":false}
          CAPEOF
          npx cap add android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -30

      - name: Locate APK
        run: |
          find /home/runner/work/Kor-Pro/Kor-Pro -name "*.apk" -type f 2>/dev/null || \
          find . -name "*.apk" -type f 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kod-pro-apk
          path: "**/*.apk"
