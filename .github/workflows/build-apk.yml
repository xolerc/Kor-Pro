name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=https://xolericuz.github.io/Kor-Pro/"></head><body>Loading...</body></html>' > www/index.html
          cat > capacitor.config.json << 'CAPEOF'
          {
            "appId": "uz.xoleric.kodpro",
            "appName": "KOD PRO",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          CAPEOF
          npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Find APK
        run: |
          find android -name "*.apk" -type f
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ./kod-pro.apk 2>/dev/null || \
          cp android/app/build/outputs/apk/debug/app-debug.apk ./kod-pro.apk 2>/dev/null || true

      - name: Commit APK
        run: |
          if [ -f kod-pro.apk ] && [ -s kod-pro.apk ]; then
            git add kod-pro.apk
            git config user.name "APK Builder"
            git config user.email "apk@xoleric.uz"
            git commit -m "add apk" || true
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kod-pro-apk
          path: kod-pro.apk
