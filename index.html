<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <title>KOD PRO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <span class="logo">KOD</span><span class="logo-accent">PRO</span>
      </div>
      <div class="header-center">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">tayyor</span>
      </div>
      <div class="header-right">
        <button id="installBtn" class="icon-btn" title="O'rnatish" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>
    </header>

    <div class="tabs-bar" id="editorTabs">
      <button class="tab active" data-tab="html">HTML</button>
      <button class="tab" data-tab="css">CSS</button>
      <button class="tab" data-tab="js">JS</button>
    </div>

    <div class="editor-wrap">
      <div class="line-numbers" id="lineNumbers">1</div>
      <textarea id="editor" class="editor" spellcheck="false" autocomplete="off" wrap="off"></textarea>
    </div>

    <div class="output-tabs-bar">
      <button class="output-tab active" data-otab="preview">PREVIEW</button>
      <button class="output-tab" data-otab="console">CONSOLE</button>
    </div>

    <div class="output-area">
      <iframe id="preview" class="preview"></iframe>
      <div id="console" class="console hidden"></div>
    </div>

    <div class="action-bar">
      <div class="action-group">
        <button id="templatesBtn" class="action-btn" title="Template">&#128196;</button>
        <button id="runBtn" class="action-btn primary" title="Ishga tushirish">&#9654;</button>
      </div>
      <div class="action-group">
        <button id="exportBtn" class="action-btn" title="Eksport">&#128228;</button>
        <button id="copyBtn" class="action-btn" title="Nusxalash">&#128203;</button>
        <button id="clearBtn" class="action-btn" title="Tozalash">&#128465;</button>
      </div>
    </div>

    <div class="bottom-nav">
      <button class="nav-btn active" data-view="editor">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        <span>Muharrir</span>
      </button>
      <button class="nav-btn" data-view="preview">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <span>Natija</span>
      </button>
      <button class="nav-btn" data-view="console">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        <span>Konsol</span>
      </button>
    </div>

    <div class="status-bar">
      <span id="cursorPos">Ln 1, Col 1</span>
      <span id="fileSize">0 B</span>
    </div>
  </div>

  <div id="templateModal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>TEMPLATELAR</h3>
        <button id="closeModal" class="icon-btn">&times;</button>
      </div>
      <div class="modal-body" id="templateList"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
